name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.dev

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate tag, version, and ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi

          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          if [ -z "$version" ] || [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match pubspec.yaml version ${version:-<missing>}" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Checked-out commit does not match $tag" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Release tag must point to a commit contained in main" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    name: Build signed Android APKs
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SELENE_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Require Android signing inputs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SELENE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SELENE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SELENE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            SELENE_ANDROID_STORE_PASSWORD \
            SELENE_ANDROID_KEY_ALIAS \
            SELENE_ANDROID_KEY_PASSWORD \
            ANDROID_SIGNING_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required Android release setting: $name" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SELENE_ANDROID_KEYSTORE_PATH"
          chmod 600 "$SELENE_ANDROID_KEYSTORE_PATH"
          test -s "$SELENE_ANDROID_KEYSTORE_PATH"

      - name: Install licensed Android NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          license_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [ "$license_status" -ne 0 ]; then
            echo "Android SDK license acceptance failed" >&2
            exit "$license_status"
          fi
          sdkmanager "ndk;29.0.14033849"

      - name: Build Android release
        shell: bash
        env:
          SELENE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SELENE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SELENE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build.sh --android-only

      - name: Verify APK signatures and certificate
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "Android apksigner was not found" >&2
            exit 1
          fi

          expected="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          apk_count=0
          for apk in dist/*.apk; do
            [ -f "$apk" ] || continue
            apk_count=$((apk_count + 1))
            output="$("$apksigner" verify --print-certs "$apk")"
            actual="$(printf '%s\n' "$output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
              echo "Unexpected signing certificate for $(basename "$apk")" >&2
              exit 1
            fi
          done
          [ "$apk_count" -eq 2 ]

      - name: Upload Android release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f "$SELENE_ANDROID_KEYSTORE_PATH"

  windows:
    name: Build Windows portable ZIP
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare verified FFmpegKit bundle
        shell: pwsh
        run: |
          ./scripts/prepare_windows_ffmpeg.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/selene-ffmpeg-kit-8.1.2-full" `
            -GithubEnvironmentFile "$env:GITHUB_ENV"

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create portable archive
        shell: pwsh
        run: |
          $archive = "selene-$env:APP_VERSION-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $archive
          if (-not (Test-Path $archive)) { throw "Windows archive was not created" }

      - name: Upload Windows release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: selene-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified GitHub Release
    needs:
      - validate
      - android
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Validate assets and create checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "selene-$APP_VERSION-armv8.apk"
            "selene-$APP_VERSION-armv7a.apk"
            "selene-$APP_VERSION-windows-x64.zip"
          )
          for asset in "${expected[@]}"; do
            test -s "release-files/$asset"
          done
          actual_count="$(find release-files -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          [ "$actual_count" -eq "${#expected[@]}" ]
          (
            cd release-files
            sha256sum "${expected[@]}" > SHA256SUMS.txt
          )

      - name: Create draft, upload, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if draft_state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft_state" != "true" ]; then
              echo "Release $tag already exists and is not a draft" >&2
              exit 1
            fi
          else
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "Selene $APP_VERSION"
          fi

          gh release upload "$tag" release-files/* --clobber

          asset_count="$(gh release view "$tag" --json assets --jq '.assets | length')"
          if [ "$asset_count" -ne 4 ]; then
            echo "Draft release contains $asset_count assets; expected 4" >&2
            exit 1
          fi

          gh release edit "$tag" --draft=false --latest
