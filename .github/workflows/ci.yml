name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run build contract tests
        run: |
          bash test/build_sh_android_arm64_test.sh
          bash test/build_sh_parallel_failure_test.sh
          bash test/ci_config_test.sh
          bash test/verify_android_release_test.sh

  artifact-roundtrip:
    name: Verify artifact upload and download
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create artifact payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact-source"
          printf '%s\n' 'selene-ci-artifact-roundtrip' > "$RUNNER_TEMP/artifact-source/payload.txt"

      - name: Upload artifact payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-artifact-roundtrip
          path: ${{ runner.temp }}/artifact-source/payload.txt
          if-no-files-found: error
          retention-days: 1

      - name: Download artifact payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-artifact-roundtrip
          path: ${{ runner.temp }}/artifact-download

      - name: Verify artifact payload
        shell: bash
        run: >-
          cmp --silent
          "$RUNNER_TEMP/artifact-source/payload.txt"
          "$RUNNER_TEMP/artifact-download/payload.txt"
